<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><link rel="stylesheet" href="collector.css"><title>快捷收集</title></head><body>
<section id="collector-box"><header><span><b></b>快捷收集</span><button id="close" title="收起收集框" aria-label="收起收集框">×</button></header>
<div id="drop-target"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 30v8h30v-8M24 8v23M15 22l9 9 9-9"/></svg><strong id="status">把素材拖到这里</strong><span id="hint">图片 · 音乐 · 文件</span></div>
<div class="folder-picker"><select id="folder-select" aria-label="收藏文件夹"></select><button id="new-folder" title="新建文件夹" aria-label="新建文件夹">＋</button></div>
<form id="folder-form" hidden><input id="folder-name" required maxlength="200" placeholder="文件夹名称" aria-label="文件夹名称"><select id="folder-parent" aria-label="上级文件夹"></select><div><button id="folder-cancel" type="button">取消</button><button type="submit">创建并选中</button></div></form>
<footer><span id="destination">收藏到：素材库</span><button id="open-main">打开素材库</button></footer><small id="shortcut"></small>
</section><script src="drop.js"></script><script src="drop-import.js"></script><script src="collector.js"></script></body></html>
